name: 'Install dependencies'
description: 'Cache and install pip dependencies'
runs:
  using: 'composite'
  steps:
    - name: Cache pip dependencies #caching pip speeds up repeated runs.
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt